# Version catalogue for the native Android client.
#
# Seeded from mindlog.talk's archived Kotlin client (`mindlog.talk/_archive/
# android/gradle/libs.versions.toml`) so its module build files stay copyable,
# then pruned to what this client actually needs and moved forward — that
# archive was pinned in December 2024 and adopting its versions as-is would
# start this project with twenty months of debt.
#
# Deliberately NOT taken forward:
#   androidx.security:security-crypto — deprecated; see :core:datastore, which
#     encrypts with an Android Keystore key directly.
#   retrofit 3.x — the kotlinx-serialization converter is validated against the
#     2.x line; not worth stacking two migrations on a first milestone.
#
# AGP 9 is not optional here: Hilt 2.60 refuses to apply below it, and staying
# on the 8.x line would mean pinning Hilt back two years. It in turn requires
# Gradle 9 — which is also what lets `build-logic` compile against Kotlin 2.3,
# since the `kotlin-dsl` plugin builds with Gradle's own embedded compiler.

[versions]
agp = "9.3.1"
kotlin = "2.3.21"
ksp = "2.3.10"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
navigationCompose = "2.9.8"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
retrofit = "2.12.0"
okhttp = "5.4.0"
kotlinxSerialization = "1.11.0"
kotlinxSerializationConverter = "1.0.0"
coroutines = "1.11.0"
datastore = "1.2.1"
browser = "1.10.0"
splashscreen = "1.2.0"
openapiGenerator = "7.24.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "kotlinxSerializationConverter" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

openapi-generator-cli = { group = "org.openapitools", name = "openapi-generator-cli", version.ref = "openapiGenerator" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

# Consumed by the convention plugins in `build-logic/`, which cannot use the
# `plugins {}` aliases below because they apply plugins programmatically.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# Applied by modules; implemented in `build-logic/convention`.
mindlog-android-application = { id = "mindlog.android.application" }
mindlog-android-application-compose = { id = "mindlog.android.application.compose" }
mindlog-android-library = { id = "mindlog.android.library" }
mindlog-android-library-compose = { id = "mindlog.android.library.compose" }
mindlog-android-hilt = { id = "mindlog.android.hilt" }
mindlog-android-feature = { id = "mindlog.android.feature" }
mindlog-android-openapi = { id = "mindlog.android.openapi" }
