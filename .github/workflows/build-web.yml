name: Build web image

# Construit et publie l'image du client web. Le déploiement de la pile est
# piloté depuis le dépôt du service, qui référence cette image par la variable
# `WEB_TAG` — indépendante du tag de l'image de l'API, les deux dépôts ayant
# leurs propres révisions.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/build-web.yml'

concurrency:
  group: build-web
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Publie sous le paquet de ce dépôt : ghcr.io/jacquesh82/mindlog.todo.clients/web
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag and lowercase prefix
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prefix=${REGISTRY}/$(echo "$IMAGE_BASE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Contexte = `web/` seul : l'image se construit en `npm ci && npm run build`.
      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/app
            VITE_BASE=/app/
          tags: |
            ${{ steps.meta.outputs.prefix }}/web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Rappel de mise en service
        run: |
          echo "Image poussée : ${{ steps.meta.outputs.prefix }}/web:${{ steps.meta.outputs.tag }}"
          echo "Ce workflow ne déploie pas : la mise en service se fait depuis le"
          echo "dépôt du service, par WEB_TAG=${{ steps.meta.outputs.tag }} docker compose up -d web"
